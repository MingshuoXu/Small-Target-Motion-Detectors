[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xttmp"
version = "2.3.0.4"
description = "eXtremely Tiny Target - Motion Perception"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Shawn MX", email = "mingshuoxu@hotmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "matplotlib",
    "opencv-python",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/MingshuoXu/Small-Target-Motion-Detectors"
Source = "https://github.com/MingshuoXu/Small-Target-Motion-Detectors"
Issues = "https://github.com/MingshuoXu/Small-Target-Motion-Detectors/issues"

[project.scripts]
xttmp_gui = "xttmp.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xttmp" = ["util/*.ico"]

[project.optional-dependencies]
torch = [
    "torch>=2.5.0",
    "torchvision>=0.20.0"
]

[dependency-groups]
dev = []

